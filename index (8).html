<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Women's Period · Calendario y bienestar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600&family=Nunito:wght@500;700&family=Lora:wght@500;700&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#e4457f;--on:#fff;--ink:#1a1517;--mute:#6f6569;--bg:#faf7f8;--line:#e7e0e3;--mixc:#fff;--mixp:70%;--r:16px;--hf:'Fraunces',Georgia,serif;--bf:'Figtree',system-ui,sans-serif;color-scheme:light}
[data-theme=dark]{--ink:#f4eef1;--mute:#a99ea3;--bg:#141113;--line:#2e272b;--mixc:#fff;--mixp:6%;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--bf);background:var(--bg);color:var(--ink);transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
:root{--card:color-mix(in srgb,var(--bg),var(--mixc) var(--mixp));--soft:color-mix(in srgb,var(--accent) 13%,var(--bg));--soft2:color-mix(in srgb,var(--accent) 26%,var(--bg));--gray:color-mix(in srgb,var(--ink) 7%,var(--bg))}
h1,h2,h3{font-family:var(--hf);font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--on);padding:.7rem 1.2rem;border-radius:99px;font-weight:600;transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--gray);color:var(--ink)}.btn.danger{background:#161214;color:#fff}
.btn.sm{padding:.45rem .9rem;font-size:.85rem}
input,select,textarea{width:100%;padding:.75rem .9rem;border-radius:12px;border:1.5px solid var(--line);background:var(--card);transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:.85rem;font-weight:600;margin:.9rem 0 .35rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem}
.muted{color:var(--mute);font-size:.9rem}
.hide{display:none!important}
/* Modo de demostración local */
.demo-banner{position:fixed;top:12px;right:12px;z-index:45;background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:40px;font-size:.76rem;font-weight:700;box-shadow:0 6px 24px #0002;pointer-events:none;animation:in .55s both}
.post{transition:box-shadow .3s,transform .3s}.post:hover{box-shadow:0 8px 28px #00000010;transform:translateY(-2px)}
.d,.chip,.card,.btn,.av{transition:transform .24s ease,box-shadow .24s ease,background .24s ease}.av{animation:pop .45s both}
@media(max-width:760px){.demo-banner{top:7px;right:7px;font-size:.64rem;padding:.35rem .6rem}.post:hover{transform:none}}
/* loader */
#loader{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);transition:opacity .6s,visibility .6s}
#loader.out{opacity:0;visibility:hidden}
.lw{text-align:center}
.drop{width:46px;height:46px;margin:auto;background:var(--accent);border-radius:0 50% 50% 50%;transform:rotate(45deg);animation:pulse 1.2s ease-in-out infinite}
.rings{position:relative;width:46px;height:46px;margin:0 auto 1.4rem}
.rings i{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:ring 1.8s ease-out infinite}
.rings i:nth-child(2){animation-delay:.6s}.rings i:nth-child(3){animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(2.8);opacity:0}}
@keyframes pulse{50%{transform:rotate(45deg) scale(.82)}}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
/* auth */
#auth{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:var(--accent);color:var(--on);padding:3rem;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.4rem,5vw,4.2rem);line-height:1.02;max-width:11ch;position:relative}
.hero p{max-width:34ch;margin-top:1rem;opacity:.92;position:relative}
.hero .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:float 9s ease-in-out infinite}
.hero .b1{width:360px;height:360px;top:-90px;right:-110px}.hero .b2{width:200px;height:200px;top:34%;left:-70px;animation-delay:-4s}
@keyframes float{50%{transform:translate(18px,26px) scale(1.06)}}
.authbox{display:grid;place-items:center;padding:2rem}
.authbox .card{width:min(420px,100%);animation:in .6s .1s both}
.tabs{display:flex;background:var(--gray);border-radius:99px;padding:4px;margin:1rem 0 .4rem}
.tabs button{flex:1;padding:.55rem;border-radius:99px;font-weight:600;color:var(--mute);transition:.25s}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0002}
.err{color:#c0183f;font-size:.85rem;margin-top:.7rem;min-height:1.2em}
/* app */
#app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.3rem;background:var(--card)}
.brand{font-family:var(--hf);font-size:1.6rem;font-weight:700;padding:0 .6rem 1rem;display:flex;align-items:center;gap:.5rem}
.brand b{width:14px;height:14px;background:var(--accent);border-radius:0 50% 50% 50%;transform:rotate(45deg);display:inline-block}
nav{display:flex;flex-direction:column;gap:.2rem}
nav button{display:flex;align-items:center;gap:.7rem;padding:.75rem .8rem;border-radius:12px;font-weight:500;color:var(--mute);text-align:left;transition:.2s}
nav button:hover{background:var(--gray);color:var(--ink)}
nav button.on{background:var(--soft2);color:var(--ink);font-weight:600}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.who{margin-top:auto;padding:.8rem;border-radius:12px;background:var(--gray);font-size:.85rem}
main{padding:2rem clamp(1rem,3vw,2.6rem) 3rem;max-width:1100px;width:100%}
main>section{animation:in .45s both}
.top{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.4rem}
.top h2{font-size:clamp(1.7rem,3vw,2.3rem)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{padding:1rem 1.1rem}.stat small{color:var(--mute)}.stat strong{display:block;font-family:var(--hf);font-size:1.5rem;margin-top:.2rem}
.calwrap{display:grid;grid-template-columns:1fr 300px;gap:1.2rem;align-items:start}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
.calhead h3{font-size:1.3rem;text-transform:capitalize}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--gray);font-size:1.1rem;transition:.2s}.iconbtn:hover{background:var(--soft2)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:.75rem;color:var(--mute);text-align:center;padding:.3rem 0;font-weight:600}
.d{aspect-ratio:1;border-radius:12px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:500;background:var(--gray);transition:transform .15s,background .25s;min-height:44px}
.d:hover{transform:scale(1.06)}.d.e{visibility:hidden}
.d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.d.sel{outline:2px solid var(--accent);outline-offset:2px}
.d.safe{background:var(--gray);color:var(--mute)}
.d.fert{background:var(--soft2)}
.d.ovu{background:var(--soft2);box-shadow:inset 0 0 0 2px var(--accent)}
.d.period{background:var(--accent);color:var(--on);animation:pop .4s both}
.d.period.pred{background:var(--soft);color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);border:0;animation:none}
.mk{font-size:.7rem;line-height:1;height:12px;margin-top:1px}
.mk svg{width:11px;height:11px;fill:currentColor}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin-top:1rem;font-size:.8rem;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:.4rem}.legend i{width:16px;height:16px;border-radius:5px;display:inline-block}
.sidecard h3{font-size:1.15rem;margin-bottom:.3rem}
.pill{display:inline-block;padding:.25rem .7rem;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--soft2);margin:.2rem .3rem .6rem 0}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
.note{font-size:.78rem;color:var(--mute);margin-top:1rem;line-height:1.45}
/* forum */
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.8rem 0}
.chip{padding:.4rem .9rem;border-radius:99px;background:var(--gray);font-size:.85rem;font-weight:500;transition:.2s}
.chip.on{background:var(--accent);color:var(--on)}
.post{margin-top:.9rem;animation:in .4s both}
.post h3{font-size:1.2rem;margin:.3rem 0}.post p{white-space:pre-wrap;line-height:1.55}
.meta{font-size:.8rem;color:var(--mute);display:flex;gap:.6rem;flex-wrap:wrap}
.reply{margin-top:.7rem;padding:.7rem .9rem;background:var(--gray);border-radius:12px;font-size:.92rem;animation:in .3s both}
.reply b{font-size:.82rem}
.rform{display:flex;gap:.5rem;margin-top:.8rem}
/* chat */
.chatbox{display:flex;flex-direction:column;height:min(68vh,640px)}
.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.7rem;padding:.3rem .2rem 1rem}
.m{max-width:86%;padding:.8rem 1rem;border-radius:18px;line-height:1.55;animation:in .35s both;font-size:.95rem}
.m.u{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:5px}
.m.a{align-self:flex-start;background:var(--gray);border-bottom-left-radius:5px}
.m ul{padding-left:1.2rem;margin:.3rem 0}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mute);margin:0 2px;animation:pulse2 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes pulse2{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-5px);opacity:1}}
.cform{display:flex;gap:.5rem;padding-top:.6rem;border-top:1px solid var(--line)}
.sugg{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
/* settings */
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.sw{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);transition:transform .2s}.sw button:hover{transform:scale(1.15)}
.line{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.5rem 0}
.tg{position:relative;width:48px;height:28px;flex:none;background:var(--line);border-radius:99px;transition:.3s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:.3s}
.tg.on{background:var(--accent)}.tg.on::after{transform:translateX(20px)}
input[type=color]{padding:2px;height:40px;width:70px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#161214;color:#fff;padding:.7rem 1.2rem;border-radius:99px;opacity:0;transition:.35s;z-index:50;font-size:.9rem;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:60;background:#0008;display:grid;place-items:center;padding:1rem;animation:fade .3s both}
#modal .card{width:min(640px,100%);max-height:86vh;overflow:auto;animation:in .35s both}
#modal h2{margin-bottom:.6rem}#modal h3{font-size:1.05rem;margin:1.1rem 0 .3rem}#modal p,#modal li{line-height:1.55;font-size:.92rem}#modal ul{padding-left:1.2rem}
@keyframes fade{from{opacity:0}}
.lk{color:var(--accent);text-decoration:underline;font-weight:600}
.chk{display:flex;gap:.6rem;align-items:flex-start;margin-top:1rem;font-size:.85rem;font-weight:400}
.chk input{width:auto;margin-top:.2rem;accent-color:var(--accent)}
.demo{background:var(--soft);border-radius:12px;padding:.7rem .9rem;font-size:.85rem;margin-top:1rem}
.av{border-radius:50%;object-fit:cover;background:var(--soft2);color:var(--accent);display:inline-grid;place-items:center;font-weight:700;font-family:var(--hf);flex:none;overflow:hidden;vertical-align:middle}
.avrow{display:flex;align-items:center;gap:1rem;margin:.8rem 0}
.seg{display:flex;gap:.4rem;flex-wrap:wrap;margin:.3rem 0}
@media(max-width:900px){.calwrap{grid-template-columns:1fr}}
@media(max-width:760px){
#auth{grid-template-columns:1fr}.hero{padding:2rem 1.5rem;min-height:230px}
#app{grid-template-columns:1fr}
aside{position:fixed;inset:auto 0 0 0;height:auto;z-index:20;flex-direction:row;padding:.4rem .5rem calc(.4rem + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line)}
.brand,.who{display:none}
nav{flex-direction:row;width:100%;justify-content:space-around}
nav button{flex-direction:column;gap:.15rem;font-size:.7rem;padding:.4rem .6rem;text-align:center}
main{padding-bottom:6rem}
.d{min-height:40px;border-radius:9px}.grid{gap:3px}
.rform,.cform{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Ciclo Motion · microinteracciones responsivas */
html{scroll-behavior:smooth}
main>section{animation:screenEnter .48s cubic-bezier(.2,.8,.2,1) both}
@keyframes screenEnter{from{opacity:0;transform:translate3d(0,20px,0) scale(.99);filter:blur(3px)}to{opacity:1;transform:translateZ(0) scale(1);filter:blur(0)}}
@keyframes cardArrive{from{opacity:0;transform:translate3d(0,18px,0) scale(.975)}to{opacity:1;transform:translateZ(0) scale(1)}}
.card{transition:transform .27s cubic-bezier(.2,.8,.2,1), box-shadow .27s, background .28s,border-color .28s}
@media(hover:hover){.stat:hover,.post:hover{transform:translateY(-3px);box-shadow:0 10px 28px #0000000c}}
button{transition:transform .2s cubic-bezier(.2,.8,.2,1),background .22s,color .22s,box-shadow .22s}
button:active{transform:scale(.94)}
nav button.on svg{animation:navPop .42s cubic-bezier(.2,.8,.2,1)}
@keyframes navPop{0%{transform:scale(.7) rotate(-12deg)}60%{transform:scale(1.16)}100%{transform:scale(1)}}
.reveal-on-scroll{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal-on-scroll.is-visible{opacity:1;transform:none}
/* La fecha del periodo se muestra en una gota, no dentro de un bloque cuadrado */
.d.period{background:transparent!important;color:var(--on);box-shadow:none;isolation:isolate;animation:dropAppear .42s cubic-bezier(.18,.85,.32,1.2) both}
.d.period::before{content:"";position:absolute;z-index:-1;width:min(94%,47px);height:min(94%,47px);inset:auto;background:var(--accent);clip-path:path('M 23.5 1 C 19 9 4 22 4 31 A 19.5 19.5 0 0 0 43 31 C 43 22 28 9 23.5 1 Z');transform:rotate(0deg);filter:drop-shadow(0 2px 2px #0001)}
.d.period.pred{color:var(--accent)!important;outline:none}
.d.period.pred::before{background:var(--soft2)}
.d.period.pred .daynum{color:var(--accent)}
.d.period .daynum{z-index:1;position:relative;font-weight:800;font-size:1rem;padding-top:7px;text-shadow:0 1px 1px #00000014}
.d.period .mk{z-index:1;margin-top:-2px;opacity:.85}
.d.period.today{outline:2px solid var(--ink);outline-offset:2px;border-radius:50%}
.d.period.sel{outline:2px solid var(--accent);outline-offset:2px;border-radius:50%}
@keyframes dropAppear{from{opacity:0;transform:translateY(-10px) scale(.7)}to{opacity:1;transform:translateY(0) scale(1)}}
.month-slide-next .grid{animation:monthForward .38s ease both}
.month-slide-prev .grid{animation:monthBackward .38s ease both}
@keyframes monthForward{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes monthBackward{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.legend i.drop-legend{background:var(--accent);clip-path:polygon(50% 0%,84% 39%,100% 67%,94% 88%,73% 100%,27% 100%,6% 88%,0% 67%,16% 39%);border-radius:0}
/* Comunidad */
.post{animation:cardArrive .4s cubic-bezier(.2,.8,.2,1) both}
.post:nth-child(2){animation-delay:.035s}.post:nth-child(3){animation-delay:.07s}.post:nth-child(4){animation-delay:.1s}
.post .author-header{display:flex;align-items:center;gap:.7rem;min-width:0;margin-bottom:.7rem}
.post .author-header .av{width:44px!important;height:44px!important;box-shadow:0 0 0 3px var(--soft2);transition:transform .3s}
.post:hover .author-header .av{transform:scale(1.07)}
.author-lines{display:flex;flex-direction:column;gap:.2rem;min-width:0}.author-lines strong{overflow-wrap:anywhere;font-size:.9rem}.author-lines small{color:var(--mute);font-size:.75rem}
.post-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.9rem;padding-top:.7rem;border-top:1px solid var(--line)}
.like-btn{display:inline-flex;align-items:center;gap:.42rem;padding:.5rem .8rem;border-radius:999px;background:var(--gray);color:var(--mute);font-size:.86rem;font-weight:700}
.like-btn .heart-svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .28s cubic-bezier(.2,.9,.3,1.5),fill .25s}
.like-btn[aria-pressed=true]{background:var(--soft2);color:var(--accent)}
.like-btn[aria-pressed=true] .heart-svg{fill:currentColor}
.like-btn.heart-pop .heart-svg{animation:heartBeat .45s cubic-bezier(.2,.8,.2,1)}
@keyframes heartBeat{0%{transform:scale(.7)}50%{transform:scale(1.32) rotate(-9deg)}100%{transform:scale(1)}}
.reply{transition:background .25s,transform .25s;animation:cardArrive .3s ease both}
.reply-header{display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem}.reply-header .av{width:28px!important;height:28px!important}.reply-footer{margin-top:.5rem}.reply .like-btn{padding:.3rem .6rem;font-size:.78rem}.reply .heart-svg{width:16px;height:16px}
@media(max-width:760px){.post .author-header .av{width:38px!important;height:38px!important}.d.period::before{width:min(98%,43px);height:min(98%,43px)}.d.period .daynum{font-size:.92rem}.post{border-radius:18px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.reveal-on-scroll{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}main>section,.post,.reply,.d.period,.month-slide-next .grid,.month-slide-prev .grid{animation:none!important}.reveal-on-scroll{opacity:1!important;transform:none!important;transition:none!important}}

/* Ciclo · compositor flotante y feedback de interacciones */
:root{--motion-ease:cubic-bezier(.2,.8,.2,1)}
.fab-drop{position:fixed;right:clamp(16px,3vw,42px);bottom:28px;width:68px;height:76px;z-index:38;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 8px 18px #e4457f55);transition:transform .3s var(--motion-ease),filter .3s}
.fab-drop::before{content:"";position:absolute;inset:3px 6px 7px;background:var(--accent);border-radius:60% 60% 60% 8%;transform:rotate(-45deg);z-index:-1;transition:transform .4s var(--motion-ease)}
.fab-drop svg{height:30px;width:30px;stroke-width:2.5;transition:transform .36s var(--motion-ease)}
.fab-drop[aria-expanded=true] svg{transform:rotate(45deg)}
.fab-drop[aria-expanded=true]::before{transform:rotate(-45deg) scale(1.07)}
.fab-drop:hover{transform:translateY(-5px);filter:drop-shadow(0 12px 22px #e4457f66)}
.fab-drop:focus-visible{outline:3px solid var(--ink);outline-offset:5px;border-radius:50%}
.composer-wrap{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;visibility:hidden;transition:visibility .32s}
.composer-wrap.is-open{visibility:visible;pointer-events:auto}
.composer-backdrop{position:absolute;inset:0;background:#110a0e99;opacity:0;backdrop-filter:blur(0);transition:opacity .35s,backdrop-filter .35s}
.composer-wrap.is-open .composer-backdrop{opacity:1;backdrop-filter:blur(5px)}

/* ===== Conocimiento del asistente (archivo .md inyectado) ===== */
const KB = "# BASE DE CONOCIMIENTO Y SYSTEM PROMPT: SALUD MENSTRUAL Y CICLO FEMENINO\n\n## 1. ROL Y DIRECTRICES DE LA IA\nActúa como una asistente experta en salud menstrual, educación ginecológica y bienestar femenino. Tu tono debe ser empático, claro, científico, libre de tabúes y directo. \n- **Límite médico (Disclaimer):** Siempre aclara que la información es educativa y no reemplaza una consulta ginecológica presencial.\n- **Triage de urgencias:** Si la usuaria reporta señales de alerta (sección 8), prioriza recomendar atención médica inmediata antes de dar consejos caseros.\n\n---\n\n## 2. PARÁMETROS CLÍNICOS NORMALES (VALORES DE REFERENCIA)\nUsa estos rangos para evaluar si lo que describe una usuaria está dentro de los parámetros habituales:\n- **Duración del ciclo completo:** 21 a 35 días en adultas (promedio 28 días); en adolescentes puede variar de 21 a 45 días durante los primeros 2 a 3 años tras la menarquia (primera menstruación).\n- **Duración del sangrado:** 2 a 7 días (promedio 4 a 5 días).\n- **Volumen total de sangre perdida por ciclo:** 30 ml a 80 ml. Menos de 30 ml se considera hipomenorrea; más de 80 ml se considera menorragia (sangrado menstrual abundante).\n- **Variabilidad normal entre ciclos:** Una variación de +/- 2 a 7 días entre un mes y otro se considera regular.\n- **pH vaginal normal (edad reproductiva):** Entre 3.8 y 4.5 (ácido, mantenido por lactobacilos). Durante la menstruación sube temporalmente porque el pH de la sangre es de 7.4.\n\n---\n\n## 3. FISIOLOGÍA PROFUNDA: EJE HPO Y LAS 4 FASES\nEl ciclo está regulado por el **Eje Hipotálamo-Pituitaria-Ovario (HPO)**:\n\n1. **Fase Menstrual (Días 1-5):**\n   - *Hormonas:* Estrógeno y progesterona en sus niveles basales más bajos.\n   - *Útero:* Descamación funcional del endometrio inducida por vasoconstricción de las arterias espirales y liberación de prostaglandinas ($PGF_{2\\alpha}$ y $PGE_2$).\n   - *Estado sistémico:* Fatiga leve, menor energía física, posible retención de líquidos residual.\n\n2. **Fase Folicular (Días 1-13):**\n   - *Hormonas:* El hipotálamo secreta GnRH en pulsos lentos, estimulando a la hipófisis a liberar FSH (Hormona Foliculoestimulante). Crecen entre 10 y 20 folículos antrales, pero por selección folicular solo uno (el folículo dominante) madura y secreta **estradiol (estrógeno)** en aumento exponencial.\n   - *Útero:* Fase proliferativa; el endometrio se regenera y engrosa (de 2 mm hasta 8-10 mm).\n   - *Estado sistémico:* Aumento de serotonina y dopamina. Mayor energía física, mejor sensibilidad a la insulina, mayor tolerancia al dolor y agudeza cognitiva.\n\n3. **Fase Ovulatoria (Días 13-15 en un ciclo de 28 días):**\n   - *Hormonas:* El nivel alto y sostenido de estradiol por más de 48 horas cambia la retroalimentación negativa a positiva en la hipófisis, disparando el **pico de LH (Hormona Luteinizante)** y un pico menor de FSH. La ovulación ocurre 24 a 36 horas después del inicio del pico de LH (y 10 a 12 horas después de su punto máximo).\n   - *Óvulo y ventana fértil:* El ovocito vive de 12 a 24 horas. Como los espermatozoides viven hasta 5 días en el moco cervical fértil, la **ventana fértil total es de unos 6 días** (los 5 días previos a la ovulación más el día de la ovulación).\n   - *Signos físicos:* Moco cervical tipo clara de huevo (elástico, transparente, alcalino para proteger espermatozoides), cérvix alto, blando y abierto. Posible *Mittelschmerz* (dolor pélvico unilateral leve al romperse el folículo).\n\n4. **Fase Lútea (Días 15-28):**\n   - *Hormonas:* La duración de esta fase es la más constante (casi siempre dura **12 a 14 días**; si un ciclo se retrasa, casi siempre se retrasó la ovulación, no la fase lútea). El folículo roto se transforma en el **cuerpo lúteo**, que secreta **progesterona** y cantidades moderadas de estrógeno.\n   - *Útero:* Fase secretora; el endometrio se vasculariza y acumula glucógeno (llega a 12-16 mm).\n   - *Efecto termogénico:* La progesterona actúa en el hipotálamo elevando la **Temperatura Corporal Basal (TCB)** entre 0.2 °C y 0.5 °C hasta el día antes del siguiente periodo.\n   - *Luteólisis:* Si no hay implantación ni hormona hCG a los 10-12 días post-ovulación, el cuerpo lúteo degenera (corpus albicans), caen la progesterona y el estrógeno, y se desencadena el Síndrome Premenstrual (SPM) y el nuevo sangrado.\n\n---\n\n## 4. CLASIFICACIÓN DEL FLUJO VAGINAL Y SANGRE MENSTRUAL\n\n### Evolución del flujo cervical durante el mes (No menstrual)\n- **Post-menstrual (Días 6-8):** Seco o flujo escaso y pegajoso.\n- **Pre-ovulatorio (Días 9-11):** Cremoso, blanco o ligeramente amarillento al secarse en la ropa interior (tipo loción).\n- **Ovulatorio (Días 12-15):** Acuoso, transparente, muy elástico (filancia mayor a 5 cm).\n- **Lúteo (Días 16-28):** Espeso, blanco, opaco o seco por efecto de la progesterona.\n\n### Interpretación del sangrado\n- **Rojo vivo:** Flujo activo y reciente.\n- **Marrón/Cafés/Negro:** Sangre oxidada de flujo lento (inicio/final del ciclo). Normal.\n- **Rosado:** Mezcla con fluido cervical (inicio del ciclo, manchado ovulatorio o niveles bajos de estrógeno).\n- **Anaranjado o Grisáceo:** Alerta de infección (vaginosis bacteriana o tricomoniasis).\n\n---\n\n## 5. MANEJO DEL DOLOR Y SÍNTOMAS ASOCIADOS\n\n### Mecanismo de las Prostaglandinas\nLa caída de progesterona rompe los lisosomas celulares del endometrio, liberando ácido araquidónico que se convierte en prostaglandinas ($PGF_{2\\alpha}$) vía la enzima ciclooxigenasa (COX). Esto causa hipercontractilidad uterina, isquemia (falta temporal de oxígeno en el músculo uterino, lo que duele) y, si pasan al torrente sanguíneo, causan **diarrea menstrual, náuseas, dolor de cabeza y mareos**.\n\n### Protocolo de alivio\n1. **Farmacológico (Inhibidores de COX / AINEs):** Ibuprofeno, naproxeno o ácido mefenámico. Funcionan mejor si se toman **24 horas antes del sangrado** o al primer síntoma, antes de que la cascada de prostaglandinas se instale. (Contraindicado en úlceras gástricas o alergias). Para quienes no toleran AINEs, el paracetamol ayuda con el umbral del dolor pero no frena las prostaglandinas.\n2. **Termoterapia:** Calor local a 40 °C en hipogastrio (vientre bajo) provoca vasodilatación y reduce la isquemia muscular.\n3. **Suplementación con evidencia:** Magnesio (glicinato o citrato, 200-300 mg/día), Ácidos grasos Omega-3 (EPA/DHA), Vitamina B1 (tiamina, 100 mg/día), Vitamina E y extracto de jengibre en polvo (250-500 mg cada 6-8 horas durante los primeros 3 días).\n\n---\n\n## 6. HIGIENE ÍNTIMA Y PRODUCTOS DE GESTIÓN MENSTRUAL\n\n### Reglas anatómicas y microbiológicas\n- **Vagina (canal interno):** Autolimpiante mediante secreciones cervicales y flora de *Lactobacillus crispatus, gasseri y jensenii* (producen ácido láctico y peróxido de hidrógeno). Prohibido el uso de duchas vaginales, óvulos caseros (ajo, yogur, aceites), vapores vaginales o jabones internos.\n- **Vulva (genitales externos):** Lavar 1 vez al día solo con agua tibia o limpiador syndet de pH ácido (3.8 - 4.5) sin fragancias. Lavar pliegues entre labios mayores y menores, pero no dentro del introito vaginal.\n- **Dirección de limpieza:** Siempre de adelante (uretra/vulva) hacia atrás (ano) para prevenir infecciones urinarias por *Escherichia coli*.\n\n### Tabla técnica de productos menstruales\n- **Toallas desechables / Tela:** Uso externo. Cambio cada 4-6 horas.\n- **Tampones:** Uso interno (absorben flujo y humedad vaginal). Cambio cada 4-6 horas (máximo absoluto 8 horas). Riesgo bajo pero real de Síndrome de Choque Tóxico (SCT) por toxina TSST-1 de *Staphylococcus aureus*.\n- **Copa menstrual:** Uso interno (recolecta, no absorbe; hecha de silicona médica o TPE). Sello por vacío ligero. Duración: hasta 12 horas. Esterilización: hervir de 5 a 10 minutos entre ciclos.\n- **Disco menstrual:** Uso interno (se coloca en el fórnix vaginal, detrás del hueso púbico; no hace vacío). Permite relaciones sexuales con penetración durante el sangrado. Duración: hasta 12 horas. Compatible con DIU (menor riesgo de desplazarlo por succión).\n- **Calzones menstruales:** Uso externo absorbente. Duración: 8 a 12 horas según flujo. Lavar con agua fría primero, sin suavizante de telas (el suavizante impermeabiliza las fibras y daña la absorción).\n\n---\n\n## 7. PATOLOGÍAS Y CONDICIONES FRECUENTES (DIFERENCIACIÓN)\n- **Dismenorrea Primaria vs. Secundaria:** La primaria es dolor menstrual común por prostaglandinas sin enfermedad pélvica subyacente (inicia poco después de la menarquia). La secundaria es dolor causado por una patología (endometriosis, adenomiosis, miomas, enfermedad pélvica inflamatoria) y suele empeorar con los años.\n- **Endometriosis:** Tejido similar al endometrio crece fuera del útero (ovarios, peritoneo, intestino). Síntomas: dismenorrea severa, dispareunia profunda (dolor al tener relaciones), disquecia (dolor al defecar en la regla) e infertilidad.\n- **Síndrome de Ovario Poliquístico (SOP / PCOS):** Trastorno endocrino-metabólico. Criterios de Rotterdam (se necesitan 2 de 3): 1) Oligo o anovulación (ciclos mayores a 35 días o ausentes), 2) Hiperandrogenismo clínico o bioquímico (acné severo, hirsutismo/vello facial, alopecia androgénica), 3) Ovarios de aspecto poliquístico en ecografía. Frecuentemente asociado a resistencia a la insulina.\n- **Trastorno Disfórico Premenstrual (TDPM / PMDD):** Forma severa y psiquiátrica del SPM (afecta al 3-8% de mujeres). Ocurre en la fase lútea tardía y desaparece al iniciar el sangrado: depresión profunda, ataques de pánico, irritabilidad extrema o ideación suicida por hipersensibilidad cerebral a las fluctuaciones normales de alopregnanolona (metabolito de la progesterona).\n\n---\n\n## 8. BANDERAS ROJAS (CUÁNDO DERIVAR AL MÉDICO DE INMEDIATO)\n1. Empapar una toalla o tampón de máxima absorción cada hora durante 2 o más horas seguidas.\n2. Sangrado que dura más de 8 días continuos.\n3. Coágulos frecuentes mayores a 2.5 cm.\n4. Dolor pélvico súbito e intenso en un solo l async function pickImg(file){
 if(!file)throw Error('Selecciona una imagen.');
 if(file.size>12*1024*1024)throw Error('La imagen supera los 12 MB.');
 const bitmap=await createImageBitmap(file).catch(()=>{throw Error('El navegador no puede leer este formato de imagen.');});
 try{
  const canvas=document.createElement('canvas');canvas.width=canvas.height=256;
  const ctx=canvas.getContext('2d');const side=Math.min(bitmap.width,bitmap.height);
  ctx.drawImage(bitmap,(bitmap.width-side)/2,(bitmap.height-side)/2,side,side,0,0,256,256);
  const result=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('Tu navegador no puede codificar AVIF.')),'image/avif',.7));
  if(result.type!=='image/avif')throw Error('Este navegador no permite exportar AVIF. Prueba una versión compatible.');
  return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('No se pudo guardar AVIF.'));r.readAsDataURL(result)});
 }finally{bitmap.close?.()}
}

function lum(h){const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)}

/* ===== Modelo del ciclo ===== */
function model(){
 const P=[...me.periods].sort((a,b)=>a.s.localeCompare(b.s));
 const gaps=[];for(let i=1;i<P.length;i++){const n=diff(P[i].s,P[i-1].s);if(n>=18&&n<=90)gaps.push(n)}
 const recent=gaps.slice(-6).sort((a,b)=>a-b),cl=recent.length?Math.round(recent.reduce((a,b)=>a+b,0)/recent.length):Math.max(21,Math.min(45,+me.cycle||28));
 const lens=P.slice(-6),pl=lens.length?Math.round(lens.reduce((a,b)=>a+b.len,0)/lens.length):me.plen;
 const C=P.map((p,i)=>({s:p.s,len:p.len,end:i<P.length-1?P[i+1].s:add(p.s,cl),pred:false}));
 if(P.length){let d=P[P.length-1].s;for(let i=0;i<12;i++){d=add(d,cl);C.push({s:d,len:pl,end:add(d,cl),pred:true})}}
 return {C,cl,pl,P,irregular:gaps.length>1&&Math.max(...gaps)-Math.min(...gaps)>7,range:recent.length?[recent[0],recent[recent.length-1]]:[cl,cl]}
}
function info(d,M){
 for(const c of M.C){if(d>=c.s&&d<c.end){const n=diff(d,c.s)+1,od=diff(d,add(c.end,-14));
  let t='safe',ph='Folicular';
  if(n<=c.len){t='period';ph='Menstrual'}else if(od===0){t='ovu';ph='Ovulación'}else if(od<0&&od>=-5){t='fert';ph='Ventana fértil'}else if(od>0)ph='Lútea';
  return{t,n,ph,c,od}}}
 return null
}

/* ===== Inicio rápido con PIN local ===== */
const QUICK_STORE='ciclo_quick_profiles';
const quickProfiles=()=>LS.get(QUICK_STORE,{});
async function pinDigest(pin,salt){
 if(!crypto?.subtle)throw Error('Para proteger el PIN, abre Ciclo desde HTTPS o un navegador compatible.');
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
 const bytes=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:210000,hash:'SHA-256'},key,256);
 return Array.from(new Uint8Array(bytes),b=>b.toString(16).padStart(2,'0')).join('');
}
async function enableQuickPin(pin){
 if(!/^\d{6}$/.test(pin))throw Error('El PIN debe tener exactamente 6 números.');
 const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
 const digest=await pinDigest(pin,salt);const entries=quickProfiles();
 entries[me.id]={salt,digest,failed:0,blockedUntil:0};LS.set(QUICK_STORE,entries);
}
function disableQuickPin(id){const entries=quickProfiles();delete entries[id];LS.set(QUICK_STORE,entries)}
function quickHTML(){
 const profiles=quickProfiles(), entries=Object.keys(profiles).filter(id=>users.some(u=>u.id===id));
 if(!entries.length)return '';
 const opts=entries.map(id=>{const u=users.find(x=>x.id===id);return `<option value="${esc(id)}">@${esc(u.username)}</option>`}).join('');
 return `<div class="quick-card"><h3>🔐 Inicio de sesión rápido</h3><p class="muted">Accede con tu PIN de 6 dígitos, sin escribir tu contraseña.</p><form id="quick-login-form"><label for="quick-account">Cuenta guardada</label><select id="quick-account">${opts}</select><label for="quick-login-pin">PIN personal</label><div class="quick-row"><input type="password" id="quick-login-pin" inputmode="numeric" autocomplete="off" pattern="[0-9]{6}" maxlength="6" minlength="6" required placeholder="••••••"><button class="btn sm" type="submit">Entrar con PIN</button></div><div class="quick-error" id="quick-login-error" role="status"></div></form><p class="quick-muted">Solo en este navegador. No compartas tu PIN ni uses esta función en dispositivos ajenos.</p></div>`;
}
function bindQuickLogin(){const f=$('#quick-login-form');if(!f)return;f.onsubmit=async e=>{
 e.preventDefault();const id=$('#quick-account').value,pin=$('#quick-login-pin').value,err=$('#quick-login-error');
 const entries=quickProfiles(),q=entries[id];if(!q)return err.textContent='Esta cuenta ya no tiene acceso rápido.';
 if(Date.now()<(q.blockedUntil||0))return err.textContent='Demasiados intentos. Prueba después de 5 minutos.';
 const b=f.querySelector('button');b.disabled=true;b.textContent='Comprobando…';
 try{const digest=await pinDigest(pin,q.salt);
 if(digest!==q.digest){q.failed=(q.failed||0)+1;if(q.failed>=5){q.failed=0;q.blockedUntil=Date.now()+300000};entries[id]=q;LS.set(QUICK_STORE,entries);err.textContent=q.blockedUntil>Date.now()?'PIN bloqueado 5 minutos.':'PIN incorrecto.';return}
 q.failed=0;q.blockedUntil=0;entries[id]=q;LS.set(QUICK_STORE,entries);
 const account=users.find(u=>u.id===id);if(!account)throw Error('No se encontró la cuenta guardada.');login(account);
 }catch(ex){err.textContent=ex.message||'Error al comprobar el PIN.'}finally{if(b.isConnected){b.disabled=false;b.textContent='Entrar con PIN'}}
 }
}

function vCal(){
 const M=model(),t=today(),ti=info(t,M),y=cur.getFullYear(),m=cur.getMonth();
 const first=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();

 let cells='';for(let i=0;i<first;i++)cells+='<div class="d e"></div>';
 const staggerCal=!skipCalAnim;
 for(let d=1;d<=days;d++){const s=`${y}-${pad(m+1)}-${pad(d)}`,i=info(s,M),c=['d',i?i.t:'',i?.t==='period'&&i.c.pred?'pred':'',s===t?'today':'',s===sel?'sel':''].join(' ');
  const mk=!i?'':i.t==='period'?'<svg viewBox="0 0 24 24"><path d="M12 2C8 8 5 11 5 15a7 7 0 0014 0c0-4-3-7-7-13z"/></svg>':i.t==='ovu'?'✦':i.t==='fert'?'●':'';
  const animAttr=staggerCal?` data-anim style="animation-delay:${(d-1)*4}ms"`:'';
  cells+=`<button class="${c}" data-d="${s}"${animAttr} aria-label="${fmt(s)}${i?': '+LBL[i.t]:''}" title="${i?LBL[i.t]:''}"><span class="daynum">${d}</span><span class="mk">${mk}</span></button>`}
 skipCalAnim=false;
 const si=info(sel,M),isStart=me.periods.some(p=>p.s===sel);
 let side=`<h3>${fmt(sel,{weekday:'long',day:'numeric',month:'long'})}</h3>`;
 if(si)side+=`<span class="pill">${LBL[si.t]}${si.t==='period'&&si.c.pred?' (estimado)':''}</span><span class="pill">Día ${si.n} del ciclo</span><p class="muted">Fase ${si.ph.toLowerCase()}.</p>`;
 else side+='<p class="muted">Aún no hay datos para este día.</p>';
 side+='<div class="row">';
 if(!isStart)side+=`<button class="btn sm" data-a="start">Mi periodo empezó este día</button>`;
 if(si&&!si.c.pred&&si.n>1&&si.n<=12&&!isStart)side+=`<button class="btn ghost sm" data-a="end">Mi periodo terminó este día</button>`;
 if(isStart)side+=`<button class="btn danger sm" data-a="del">Quitar este inicio</button>`;
 side+='</div>';
 main(`<div class="top"><div><h2>Hola, ${esc(me.name.split(' ')[0])}</h2><p class="muted">Marca el primer día de cada periodo y el calendario calcula el resto.</p></div></div>

 <div class="card stat"><small>Próximo periodo</small><strong>${dn===null?'—':dn===0?'Hoy':'En '+dn+' d'}</strong><small>${nextP?fmt(nextP.s):'Sin datos'}</small></div>
 <div class="card stat"><small>Ciclo</small><strong>Cada mes</strong><small>Periodo: ${M.P.length?M.pl:me.plen} días</small></div></div>
 ${nextP&&ov?`<div class="stats"><div class="card stat"><small>Próximo periodo</small><strong>${fmt(nextP.s,sh)}</strong><small>Hasta el ${fmt(add(nextP.s,nextP.len-1),sd)} · ${nextP.len} días</small></div><div class="card stat"><small>Próxima ovulación</small><strong>${fmt(ov,sh)}</strong><small>${diff(ov,t)===0?'Hoy':'En '+diff(ov,t)+' días'}</small></div><div class="card stat"><small>Ventana fértil</small><strong>${fmt(add(ov,-5),sd)} – ${fmt(ov,sd)}</strong><small>6 días</small></div></div>`:''}
 <div class="calwrap"><div class="card"><div class="calhead"><button class="iconbtn" data-n="-1" aria-label="Mes anterior">‹</button><h3>${cur.toLocaleDateString('es',{month:'long',year:'numeric'})}</h3><button class="iconbtn" data-n="1" aria-label="Mes siguiente">›</button></div>
 <div class="grid">${['L','M','X','J','V','S','D'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells}</div>
 <div class="legend"><span><i class="drop-legend"></i>Periodo</span><span><i style="background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)"></i>Estimado</span><span><i style="background:var(--soft2)"></i>Fértil</span><span><i style="background:var(--soft2);box-shadow:inset 0 0 0 2px var(--accent)"></i>Ovulación ✦</span><span><i style="background:var(--gray)"></i>Baja fertilidad</span></div></div>

const md=t=>{let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');const L=h.split('\n');let o='',ul=false;for(const l of L){const m=l.match(/^\s*[\*\-]\s+(.*)/);if(m){if(!ul){o+='<ul>';ul=true}o+=`<li>${m[1]}</li>`}else{if(ul){o+='</ul>';ul=false}o+=l?l+'<br>':''}}return o+(ul?'</ul>':'')};
async function askGemini(key){
 const body=JSON.stringify({systemInstruction:{parts:[{text:SYSTEM}]},contents:chat.slice(-12).map(c=>({role:c.role,parts:[{text:c.text}]})),generationConfig:{temperature:.5,maxOutputTokens:2048,thinkingConfig:{thinkingLevel:"low"}}});
 const gl=`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
 const vertex=`https://aiplatform.googleapis.com/v1/publishers/google/models/${MODEL}:generateContent`;
 const urls=key.startsWith('AQ.')?[vertex,gl]:[gl];let err='';
 for(const u of urls){try{
  const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body});
  const j=await r.json().catch(()=>({}));
  if(r.ok){const c=j.candidates?.[0],t=(c?.content?.parts||[]).map(p=>p.text||'').join('').trim();if(t)return[true,t];err=j.promptFeedback?.blockReason?'La consulta fue bloqueada por seguridad. Reformúlala.':'Gemini no devolvió texto ('+(c?.finishReason||'sin motivo')+').';continue}
  if(r.status===429)return[false,'Se alcanzó el límite de solicitudes o la cuota de tu clave. Revisa el consumo y los límites en Google AI Studio.'];
  err=(j.error?.message||'Error '+r.status).slice(0,220)
 }catch(e){err='No se pudo conectar con Gemini ('+(e.message||'red')+'). Revisa tu internet.'}}
 return[false,'No pude responder: '+err+' — Si el problema es la clave, revisa tu clave en Google AI Studio y vuelve a introducirla en el asistente.']}

/* ===== Animaciones añadidas ===== */

/* Ripple en cualquier .btn */
document.addEventListener('pointerdown',e=>{
 const btn=e.target.closest('.btn');
 if(!btn)return;
 const r=btn.getBoundingClientRect();
 const size=Math.max(r.width,r.height)*1.2;
 const span=document.createElement('span');
 span.className='ripple';
 span.style.width=span.style.height=size+'px';
 span.style.left=(e.clientX-r.left-size/2)+'px';
 span.style.top=(e.clientY-r.top-size/2)+'px';
 btn.appendChild(span);
 span.addEventListener('animationend',()=>span.remove());
});

/* Contadores animados en .stat strong (una vez por vista) */
function animateCounters(){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 document.querySelectorAll('#main .stat strong').forEach(el=>{
  const orig=el.textContent;
  const m=orig.match(/\d+/);
  if(!m)return;
  const target=parseInt(m[0],10);
  if(target<2)return;
  const before=orig.slice(0,m.index);
  const after=orig.slice(m.index+m[0].length);
  const dur=Math.min(900,400+target*12);
  const t0=performance.now();
  const ease=p=>1-Math.pow(1-p,3);
  function step(now){
   const p=Math.min(1,(now-t0)/dur);
   el.textContent=before+Math.round(ease(p)*target)+after;
   if(p<1)requestAnimationFrame(step);
   else el.textContent=orig;
  }
  requestAnimationFrame(step);
 });
}

/* Confetti desde un punto */
function confettiAt(cx,cy){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const colors=['#e4457f','#ff8ab8','#ffb3d1','#ffd6e8','#fff0f6','#c0265a'];
 for(let i=0;i<26;i++){
  const p=document.createElement('div');
  p.className='confetti-piece';
  p.style.left=cx+'px';
  p.style.top=cy+'px';
  p.style.background=colors[i%colors.length];
  p.style.width=(6+Math.random()*6)+'px';
  p.style.height=(6+Math.random()*6)+'px';
  p.style.borderRadius=Math.random()>.5?'50%':'2px';
  document.body.appendChild(p);
  const angle=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1;
  const dist=90+Math.random()*130;
  const dx=Math.cos(angle)*dist;
  const dy=Math.sin(angle)*dist;
  const rot=(Math.random()-.5)*900;
  p.animate([
   {transform:'translate(-50%,-50%) rotate(0deg) scale(1)',opacity:1},
   {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rot}deg) scale(.4)`,opacity:0}
  ],{duration:850+Math.random()*450,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>p.remove();
 }
}

/* Corazones que brotan del botón de like */
function heartBurst(btn){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const r=btn.getBoundingClientRect();
 const cx=r.left+24,cy=r.top+r.height/2;
 for(let i=0;i<6;i++){
  const s=document.createElement('span');
  s.className='heart-particle';
  s.textContent='♥';
  s.style.left=cx+(Math.random()*24-12)+'px';
  s.style.top=cy+'px';
  s.style.color='var(--accent)';
  s.style.fontSize=(11+Math.random()*9)+'px';
  document.body.appendChild(s);
  const dx=(Math.random()-.5)*50;
  const dy=-(40+Math.random()*40);
  s.animate([
   {transform:'translate(-50%,-50%) scale(.4)',opacity:1},
   {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1)`,opacity:0}
  ],{duration:700+Math.random()*350,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>s.remove();
 }
}
